<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewport preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #dfe1ea; }
  .frame { width: 390px; margin: 0 auto; background: #fff; }
  iframe { display: block; width: 390px; height: 2400px; border: 0; }
</style>
<script>
  const width = Number(new URLSearchParams(location.search).get('w')) || 390;
  document.addEventListener('DOMContentLoaded', () => {
    const frame = document.querySelector('.frame');
    const view = document.querySelector('iframe');
    frame.style.width = width + 'px';
    view.style.width = width + 'px';
    view.src = './index.html?preview=' + width;
  });
</script>
</head>
<body>
<div class="frame"><iframe title="미리보기"></iframe></div>
</body>
</html>
