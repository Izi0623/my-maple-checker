<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>카카오 알림 인증 완료</title><style>body{font:16px sans-serif;max-width:640px;margin:50px auto;padding:24px;line-height:1.8}textarea{width:100%;height:130px}button{padding:12px}a{display:block;margin-top:20px}</style></head><body><h1>카카오 인증 확인</h1><p id="status"></p><textarea id="response" readonly aria-label="Apps Script에 등록할 인증 응답"></textarea><button id="copy">인증 응답 복사</button><p>이 값을 Google Apps Script의 <strong>AUTHORIZATION_RESPONSE</strong> 스크립트 속성에 붙여 넣고 <strong>connectKakao</strong>를 실행하세요. 인증 코드는 일회용이므로 바로 등록해 주세요. 채팅이나 GitHub에 올리지 마세요.</p><a href="./reminders-setup.html">설정 안내로 돌아가기</a><script>
const params=new URLSearchParams(location.search), code=params.get('code'), state=params.get('state');
history.replaceState(null,'',location.pathname);
if(code&&state){document.querySelector('#response').value=JSON.stringify({code,state});document.querySelector('#status').textContent='로그인 완료. 아래 인증 응답을 Apps Script에 등록하세요.';}else{document.querySelector('#status').textContent='인증 코드가 없어요. Apps Script에서 getKakaoLoginUrl을 실행해 새 로그인 주소를 여세요.';document.querySelector('#copy').disabled=true;}
document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.querySelector('#response').value);document.querySelector('#status').textContent='복사했어요. Apps Script 속성에 등록해 주세요.';}catch{document.querySelector('#response').select();}});
</script></body></html>
